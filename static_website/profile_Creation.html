<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hirely-Profile Creation</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            width: 100%;
            max-width: 1100px;
            text-align: center;
        }

        .logo {
            font-size: 65px;
            font-weight: bold;
            color: #6f89a8;
            text-decoration: underline;
            margin-bottom: 20px;
        }

        .profile-box {
            background: #fff;
            border-radius: 35px;
            padding: 50px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
            text-align: left;
        }

        .title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 32px;
        }

        .form-group {
            width: 40%;
            margin: auto;
            margin-bottom: 28px;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .required {
            color: red;
        }

        .input-box {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
        }

        .input-box i {
            margin-right: 12px;
            font-size: 18px;
        }

        .input-box input,
        .input-box textarea {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
            resize: none;
        }

        .file-input {
            margin-top: 10px;
        }

        .experience-box {
            width: 40%;
            margin: 25px auto;
            border: 2px solid #333;
            padding: 15px;
        }

        .experience-box input,
        .experience-box textarea {
            width: 100%;
            border: none;
            border-bottom: 2px solid #222;
            padding: 10px 0;
            margin-bottom: 15px;
            outline: none;
            font-size: 16px;
            resize: none;
        }

        .submit-btn {
            display: block;
            margin: 35px auto 0;
            padding: 12px 50px;
            border: none;
            border-radius: 25px;
            background: #aac1d1;
            color: #5d7694;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .submit-btn:hover {
            background: #94b3c7;
        }

        /* Popup */

        .popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            animation: slide 0.5s ease;
            z-index: 1000;
        }

        @keyframes slide {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media(max-width: 768px) {

            .form-group,
            .experience-box {
                width: 100%;
            }

            .profile-box {
                padding: 30px 20px;
            }

            .logo {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- Popup -->
    <div class="popup" id="popupMessage">
        Profile Created Successfully!
    </div>

    <div class="container">

        <h1 class="logo">Hirely.</h1>

        <div class="profile-box">

            <h2 class="title">Profile Creation</h2>

            <form id="profileForm">

                <!-- Full Name -->
                <div class="form-group">
                    <label>
                        Full name <span class="required">*</span>
                    </label>

                    <div class="input-box">
                        <i class="fa-regular fa-user"></i>

                        <input type="text" id="fullname" placeholder="Enter full name">
                    </div>
                </div>

                <!-- Email -->
                <div class="form-group">
                    <label>
                        Email Address <span class="required">*</span>
                    </label>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="email" placeholder="Enter email">
                    </div>
                </div>

                <!-- Contact -->
                <div class="form-group">
                    <label>
                        Contact number <span class="required">*</span>
                    </label>

                    <div class="input-box">
                        <i class="fa-solid fa-phone"></i>

                        <input type="text" id="phone" placeholder="Enter mobile number">
                    </div>
                </div>

                <!-- Skills -->
                <div class="form-group">
                    <label>
                        Skills <span class="required">*</span>
                    </label>

                    <div class="input-box">
                        <i class="fa-solid fa-graduation-cap"></i>

                        <input type="text" id="skills" placeholder="Enter skills">
                    </div>
                </div>

                <!-- Upload CV -->
                <div class="form-group">
                    <label>
                        Upload CV <span class="required">*</span>
                    </label>

                    <input type="file" id="cv" class="file-input">
                </div>

                <!-- Work Experience 1 -->
                <div class="experience-box">

                    <h3 style="margin-bottom:15px;">
                        Work Experience
                    </h3>

                    <input type="text" id="company1"
                        placeholder="Company Name">

                    <input type="text" id="duration1"
                        placeholder="Duration">

                    <textarea id="role1"
                        placeholder="Role Description"></textarea>

                </div>

                <!-- Work Experience 2 -->
                <div class="experience-box">

                    <input type="text" id="company2"
                        placeholder="Company Name">

                    <input type="text" id="duration2"
                        placeholder="Duration">

                    <textarea id="role2"
                        placeholder="Role Description"></textarea>

                </div>

                <!-- Certificates -->
                <div class="form-group">
                    <label>Certificates</label>

                    <input type="file" id="certificate"
                        class="file-input">
                </div>

                <!-- Portfolio -->
                <div class="form-group">
                    <label>
                        Portfolio/LinkedIn URL
                    </label>

                    <div class="input-box">
                        <input type="url" id="portfolio"
                            placeholder="Enter portfolio or LinkedIn URL">
                    </div>
                </div>

                <!-- Submit -->
                <button type="submit" class="submit-btn">
                    SUBMIT
                </button>

            </form>

        </div>

    </div>

    <script>

        const form = document.getElementById("profileForm");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            // Get Values
            let fullname = document.getElementById("fullname").value.trim();
            let email = document.getElementById("email").value.trim();
            let phone = document.getElementById("phone").value.trim();
            let skills = document.getElementById("skills").value.trim();
            let cv = document.getElementById("cv").value;
            let portfolio = document.getElementById("portfolio").value.trim();

            // Full Name Validation
            if (fullname === "") {
                alert("Please enter full name");
                return;
            }

            // Email Validation
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!email.match(emailPattern)) {
                alert("Please enter valid email address");
                return;
            }

            // Phone Validation
            let phonePattern = /^[0-9]{10}$/;

            if (!phone.match(phonePattern)) {
                alert("Please enter valid 10-digit mobile number");
                return;
            }

            // Skills Validation
            if (skills === "") {
                alert("Please enter your skills");
                return;
            }

            // CV Validation
            if (cv === "") {
                alert("Please upload your CV");
                return;
            }

            // Portfolio URL Validation (Optional)
            if (portfolio !== "") {

                let urlPattern =
                    /^(https?:\/\/)?([\w\d-]+\.)+\w{2,}(\/.*)?$/;

                if (!portfolio.match(urlPattern)) {
                    alert("Please enter valid portfolio URL");
                    return;
                }
            }

            // Popup Message
            const popup =
                document.getElementById("popupMessage");

            popup.style.display = "block";

            setTimeout(() => {

                popup.style.display = "none";

            }, 3000); 

            // Reset Form
            form.reset();

        });

    </script>

</body>

</html>
