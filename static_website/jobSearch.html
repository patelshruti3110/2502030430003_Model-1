<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hirely - Job Search & Application</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css" />
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: #edf1f7;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            padding: 50px 20px;
        }

        .logo-container {
            margin-bottom: 40px;
        }

        .main-logo {
            font-size: 56px;
            font-weight: 700;
            color: #6d89ab;
            text-decoration: underline;
            letter-spacing: 1px;
        }

        .search-card {
            background: white;
            border-radius: 35px;
            padding: 50px 80px;
            width: 100%;
            max-width: 650px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.05);
        }

        .card-title {
            text-align: center;
            font-size: 20px;
            font-weight: 700;
            color: #222;
            margin-bottom: 50px;
        }

        .search-form {
            display: flex;
            flex-direction: column;
            gap: 35px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 12px;
            position: relative;
        }

        .form-group label {
            font-size: 15px;
            font-weight: 500;
            color: #222;
        }

        .form-group input[type="text"],
        .form-group select {
            border: none;
            border-bottom: 2px solid #222;
            padding: 5px 0;
            font-size: 14px;
            color: #333;
            outline: none;
            background: transparent;
            width: 100%;
            border-radius: 0;
            appearance: none;
            -webkit-appearance: none;
        }

        .select-wrapper {
            position: relative;
            width: 100%;
        }

        .select-wrapper::after {
            content: '\f107'; /* FontAwesome angle-down */
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            right: 5px;
            bottom: 8px;
            color: #222;
            pointer-events: none;
            font-size: 14px;
        }

        .form-group select {
            padding-right: 25px;
            cursor: pointer;
        }

        .placeholder-option {
            color: #999;
        }

        /* Set placeholder color for select */
        select:invalid,
        select option[value=""] {
            color: #999;
        }

        select option {
            color: #333;
        }

        /* Salary Range Slider */
        .salary-group {
            gap: 5px;
        }

        .salary-header {
            display: flex;
            justify-content: space-between;
            align-items: flex-end;
            margin-bottom: 8px;
        }

        .salary-max {
            font-size: 11px;
            color: #666;
            margin-right: 5px;
        }

        .range-slider-container {
            width: 100%;
            display: flex;
            align-items: center;
        }

        input[type=range] {
            -webkit-appearance: none;
            width: 100%;
            height: 14px;
            background: linear-gradient(to right, #6d89ab 0%, #6d89ab 30%, #fff 30%, #fff 100%);
            border: 1px solid #222;
            border-radius: 10px;
            outline: none;
            padding: 0;
            margin: 0;
        }

        input[type=range]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #6d89ab;
            border: 1px solid #222;
            cursor: pointer;
        }

        input[type=range]::-moz-range-thumb {
            width: 18px;
            height: 18px;
            border-radius: 50%;
            background: #6d89ab;
            border: 1px solid #222;
            cursor: pointer;
        }

        /* Submit Button */
        .submit-btn {
            margin-top: 20px;
            background: #a9c1d8;
            color: #6d89ab;
            border: none;
            padding: 12px 40px;
            border-radius: 25px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            align-self: center;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .submit-btn:hover {
            background: #87a6c4;
            color: #fff;
        }

        /* Responsive */
        @media (max-width: 768px) {
            .search-card {
                padding: 40px 30px;
            }
        }
    </style>
</head>

<body>

    <div class="logo-container">
        <h1 class="main-logo">Hirely</h1>
    </div>

    <div class="search-card">
        <h2 class="card-title">Job Search & Application</h2>

        <form class="search-form" onsubmit="event.preventDefault(); window.location.href='./empHomepage.html';">
            
            <div class="form-group">
                <label>Keywords</label>
                <input type="text" />
            </div>

            <div class="form-group">
                <label>Job Type</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="" disabled selected class="placeholder-option">Select Job Type</option>
                        <option value="full-time">Full Time</option>
                        <option value="part-time">Part Time</option>
                        <option value="contract">Contract</option>
                        <option value="internship">Internship</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Experience</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="" disabled selected class="placeholder-option">Select Experience</option>
                        <option value="fresher">Fresher</option>
                        <option value="1-3">1 - 3 Years</option>
                        <option value="3-5">3 - 5 Years</option>
                        <option value="5+">5+ Years</option>
                    </select>
                </div>
            </div>

            <div class="form-group salary-group">
                <div class="salary-header">
                    <label>Salary Range</label>
                    <span class="salary-max">0-10,000</span>
                </div>
                <div class="range-slider-container">
                    <input type="range" min="0" max="10000" value="3000" id="salaryRange">
                </div>
            </div>

            <div class="form-group">
                <label>City</label>
                <div class="select-wrapper">
                    <select required>
                        <option value="" disabled selected class="placeholder-option">Select City</option>
                        <option value="mumbai">Mumbai</option>
                        <option value="delhi">Delhi</option>
                        <option value="bangalore">Bangalore</option>
                        <option value="hyderabad">Hyderabad</option>
                        <option value="pune">Pune</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Skills</label>
                <input type="text" />
            </div>

            <button type="submit" class="submit-btn">Search</button>

        </form>
    </div>

    <script>
        // Make the salary range slider fill dynamically
        const slider = document.getElementById('salaryRange');
        
        function updateSliderBackground() {
            const min = slider.min ? slider.min : 0;
            const max = slider.max ? slider.max : 100;
            const val = slider.value;
            const percentage = ((val - min) / (max - min)) * 100;
            slider.style.background = `linear-gradient(to right, #6d89ab 0%, #6d89ab ${percentage}%, #fff ${percentage}%, #fff 100%)`;
        }

        // Initialize background
        updateSliderBackground();

        // Update on input
        slider.addEventListener('input', updateSliderBackground);

        // Handle placeholder color for selects
        const selects = document.querySelectorAll('select');
        selects.forEach(select => {
            select.addEventListener('change', function() {
                if (this.value) {
                    this.style.color = '#333';
                } else {
                    this.style.color = '#999';
                }
            });
        });
    </script>
</body>

</html>
