<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hirely-Login</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #eef2f7;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            text-align: center;
        }

        .logo {
            font-size: 60px;
            font-weight: bold;
            color: #6f89a8;
            text-decoration: underline;
            margin-bottom: 20px;
        }

        .login-box {
            background: #fff;
            border-radius: 35px;
            padding: 50px;
            width: 75%;
            margin: auto;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.25);
        }

        .title {
            margin-bottom: 50px;
            font-size: 32px;
        }

        .form-group {
            width: 55%;
            margin: auto;
            margin-bottom: 35px;
            text-align: left;
        }

        .form-group label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
        }

        .input-box {
            display: flex;
            align-items: center;
            border-bottom: 2px solid #000;
            padding-bottom: 8px;
        }

        .input-box i {
            margin-right: 12px;
            color: #222;
            font-size: 18px;
        }

        .input-box input {
            width: 100%;
            border: none;
            outline: none;
            background: transparent;
            font-size: 16px;
        }

        .toggle-password {
            cursor: pointer;
        }

        .forgot {
            text-align: right;
            margin-top: 8px;
        }

        .forgot a {
            text-decoration: none;
            color: #333;
            font-size: 15px;
        }

        .login-btn {
            margin-top: 20px;
            padding: 10px 45px;
            border: 1px solid #7c97b6;
            border-radius: 25px;
            background: #aac1d1;
            color: #4d6b8f;
            font-size: 18px;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: #92aec4;
        }

        .divider {
            margin: 35px auto;
            width: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
        }

        .divider::before,
        .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #555;
        }

        .social-title {
            margin-bottom: 20px;
            font-size: 22px;
        }

        .social-buttons {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-bottom: 25px;
        }

        .social-btn {
            border: 2px solid #aac1d1;
            border-radius: 30px;
            padding: 10px 25px;
            background: white;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 16px;
        }

        .signup-link {
            font-size: 17px;
        }

        .signup-link a {
            text-decoration: none;
            color: #6f89a8;
            font-weight: bold;
        }

        /* Popup Message */
        .popup {
            position: fixed;
            top: 20px;
            right: 20px;
            background: #4CAF50;
            color: white;
            padding: 15px 25px;
            border-radius: 10px;
            display: none;
            font-size: 16px;
            animation: slide 0.5s ease;
            z-index: 1000;
        }

        @keyframes slide {
            from {
                transform: translateX(100px);
                opacity: 0;
            }

            to {
                transform: translateX(0);
                opacity: 1;
            }
        }

        @media(max-width: 768px) {
            .login-box {
                width: 100%;
                padding: 35px 20px;
            }

            .form-group {
                width: 100%;
            }

            .social-buttons {
                flex-direction: column;
            }

            .logo {
                font-size: 45px;
            }
        }
    </style>
</head>

<body>

    <!-- Popup -->
    <div class="popup" id="popup">
        Login Successful!
    </div>

    <div class="container">

        <h1 class="logo">Hirely.</h1>

        <div class="login-box">

            <h2 class="title">Login Page</h2>

            <form id="loginForm">

                <!-- Email -->
                <div class="form-group">
                    <label>Email Address</label>

                    <div class="input-box">
                        <i class="fa-regular fa-envelope"></i>

                        <input type="email" id="email" placeholder="Enter Email">
                    </div>
                </div>

                <!-- Password -->
                <div class="form-group">

                    <label>Password</label>

                    <div class="input-box">
                        <i class="fa-solid fa-key"></i>

                        <input type="password" id="password" placeholder="Enter Password">

                        <i class="fa-regular fa-eye toggle-password" id="togglePassword"></i>
                    </div>

                    <div class="forgot">
                        <a href="#">Forgot Password?</a>
                    </div>

                </div>

                <!-- Login Button -->
                <button type="submit" class="login-btn">
                    LOGIN
                </button>

            </form>

            <!-- Divider -->
            <div class="divider">
                Or
            </div>

            <!-- Social Login -->
            <h3 class="social-title">Sign-in with</h3>

            <div class="social-buttons">

                <button class="social-btn">
                    <i class="fa-brands fa-linkedin"></i>
                    LinkedIn
                </button>

                <button class="social-btn">
                    <i class="fa-brands fa-google"></i>
                    Google
                </button>

            </div>

            <!-- Signup Link -->
            <div class="signup-link">
                Don't have an account?
                <a href="registration.html">Sign up</a>
            </div>

        </div>

    </div>

    <script>

        // Password Show/Hide
        const togglePassword = document.getElementById("togglePassword");
        const password = document.getElementById("password");

        togglePassword.addEventListener("click", () => {

            if (password.type === "password") {

                password.type = "text";

                togglePassword.classList.remove("fa-eye");
                togglePassword.classList.add("fa-eye-slash");

            } else {

                password.type = "password";

                togglePassword.classList.remove("fa-eye-slash");
                togglePassword.classList.add("fa-eye");
            }
        });


        // Form Validation
        const form = document.getElementById("loginForm");

        form.addEventListener("submit", function (e) {

            e.preventDefault();

            let email = document.getElementById("email").value.trim();
            let passwordValue = password.value.trim();

            // Email Validation
            let emailPattern = /^[^ ]+@[^ ]+\.[a-z]{2,3}$/;

            if (!email.match(emailPattern)) {

                alert("Please enter a valid email address");
                return;
            }

            // Password Validation
            if (passwordValue.length < 6) {

                alert("Password must be at least 6 characters");
                return;
            }

            // Success Popup
            const popup = document.getElementById("popup");

            popup.style.display = "block";

            setTimeout(() => {

                popup.style.display = "none";
                
                // Redirect to Home Page
                window.location.href = "./empHomepage.html";

            }, 3000);

            // Reset Form
            form.reset();
        });

    </script>

</body>

</html>
