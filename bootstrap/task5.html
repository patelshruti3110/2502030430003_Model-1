<!DOCTYPE html>
<html lang="en">
<head>
    <title>Food Cards</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">
    <div class="row g-4">

        <!-- Card 1 -->
        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1568901346375-23c9450c58cd" class="card-img-top">

                <div class="card-body text-center">
                    <h5>Burger</h5>
                    <p>₹199</p>
                    <button class="btn btn-warning">Order</button>
                </div>
            </div>
        </div>

        <!-- Repeat Cards -->

        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1546069901-ba9599a7e63c" class="card-img-top">

                <div class="card-body text-center">
                    <h5>Pizza</h5>
                    <p>₹299</p>
                    <button class="btn btn-warning">Order</button>
                </div>
            </div>
        </div>

        <div class="col-md-4">
            <div class="card">
                <img src="https://images.unsplash.com/photo-1550547660-d9450f859349" class="card-img-top">

                <div class="card-body text-center">
                    <h5>Pasta</h5>
                    <p>₹249</p>
                    <button class="btn btn-warning">Order</button>
                </div>
            </div>
        </div>

    </div>
</div>

</body>
</html>
