<!DOCTYPE html>
<html lang="en">
<head>
    <title>Hero Section</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>
        .hero {
            background: url('https://images.unsplash.com/photo-1504674900247-0877df9cc836') center/cover;
            height: 90vh;
            position: relative;
        }

        .overlay {
            position: absolute;
            inset: 0;
            background: rgba(0,0,0,0.5);
        }

        .hero-content {
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>

<section class="hero d-flex justify-content-center align-items-center text-center text-white">
    <div class="overlay"></div>

    <div class="hero-content">
        <h1 class="display-2">Enjoy Delicious Food</h1>
        <button class="btn btn-warning btn-lg mt-3">Order Now</button>
    </div>
</section>

</body>
</html>
