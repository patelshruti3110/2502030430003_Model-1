<!DOCTYPE html>
<html>

<head>
    <title>Nested List in HTML</title>
</head>

<body style="font-family: Arial, sans-serif; background-color: #f4f7fb; padding: 20px;">

    <h2 style="color: #2c3e50; text-align: center;">
        Nested List
    </h2>

    <ul style="background-color: white; width: 350px; margin: auto; padding: 20px; border-radius: 10px; box-shadow: 0px 0px 10px rgba(0,0,0,0.2); line-height: 1.8;">

        <li style="font-weight: bold; color: #AAC1D1;">
            Engineering 
            <ul style="color: #333; font-weight: normal;">
                <li>Diploma</li>
                <li>Btech</li>
            </ul>
        </li>

        <li style="font-weight: bold; color: #AAC1D1;">
            Diploma
            <ol style="color: #333; font-weight: normal;">
                <li>CE</li>
                <li>CSE</li>
                <li>IT</li>
            </ol>
        </li>

        <li style="font-weight: bold; color: #AAC1D1;">
            Btech
            <ol style="color: #333; font-weight: normal;">
                <li>CE</li>
                <li>CSE</li>
                <li>IT</li>
            </ol>
        </li>

    </ul>

</body>

</html>
